version: "3.8"

x-known-peers: &known-peers >-
  --consensus.known-peers 0x1b040599fa8420315da0b6ba4fa079171e898c71cbcf7dc3d443a9859b83cfee@172.20.0.11:8000,0xf9bae1f8b538d0959878a79265c8aad301073919081e031f3b8458a9c1ea6f9b@172.20.0.12:8000,0x291b5fc290d027f7db1143874b4a55001ee148fcc831a1a321ebba3fccd40a38@172.20.0.13:8000,0xa5fda96a0acbccacc7eb6cbe8c7daab95d2fdb07ee7a76214d1ed3fa349a6984@172.20.0.14:8000

services:
  v1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: private-v1
    hostname: v1
    volumes:
      - v1-data:/data
      - ./keys/v1:/keys:ro
    networks:
      private-net:
        ipv4_address: 172.20.0.11
    ports:
      - "8545:8545" # JSON-RPC only on v1
    environment:
      - RUST_LOG=info,commonware_p2p=debug,commonware_consensus=debug
    command: >
      node --dev --datadir /data --http --http.addr 0.0.0.0 --http.port 8545 --http.api eth,net,web3,debug --http.corsdomain "*" --consensus.signing-key /keys/ed25519.hex --consensus.listen-address 0.0.0.0:8000 --consensus.datadir /data/consensus --consensus.fee-recipient 0x0000000000000000000000000000000000000001 --consensus.use-local-defaults --consensus.allow-private-ips --consensus.known-peers 0x1b040599fa8420315da0b6ba4fa079171e898c71cbcf7dc3d443a9859b83cfee@172.20.0.11:8000,0xf9bae1f8b538d0959878a79265c8aad301073919081e031f3b8458a9c1ea6f9b@172.20.0.12:8000,0x291b5fc290d027f7db1143874b4a55001ee148fcc831a1a321ebba3fccd40a38@172.20.0.13:8000,0xa5fda96a0acbccacc7eb6cbe8c7daab95d2fdb07ee7a76214d1ed3fa349a6984@172.20.0.14:8000
    deploy:
      resources:
        limits:
          memory: 3500m
          cpus: "1.5"

