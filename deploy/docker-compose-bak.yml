      - ./keys/v1:/keys:ro
      - ./genesis.json:/genesis.json:ro
    networks:
      private-net:
        ipv4_address: 172.20.0.11
    ports:
      - "8545:8545"
    environment:
      - RUST_LOG=info,commonware_p2p=debug,commonware_consensus=debug
